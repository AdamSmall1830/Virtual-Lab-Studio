openapi: 3.1.0
info:
  title: Virtual Lab Studio API
  version: 0.1.0
paths:
  /v1/auth/clerk-login:
    post:
      summary: Clerk Login
      description: 'Bridge a verified Clerk identity into the app session cookie.


        The browser sends its short-lived Clerk session JWT as a Bearer token;

        we verify it server-side (JWKS signature + Clerk Backend API profile),

        upsert the user, provision their private workspace on first sign-in,

        and set the same signed session cookie the rest of the API relies on.'
      operationId: clerk_login_api_v1_auth_clerk_login_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
