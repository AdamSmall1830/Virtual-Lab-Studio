kind = "web"
previewPath = "/"
title = "Virtual Lab Studio"
description = "Virtual Lab Studio — a human-guided multi-agent academic research workspace built around the open-source Virtual Lab meeting engine. Researchers create projects, assemble model-driven research teams, run team and expert-critic meetings with evidence grounding, watch runs live, and export reproducibility packets."
version = "1.0.0"
id = "artifacts/studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18425

[services.development]
run = "pnpm --filter @workspace/studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18425"
BASE_PATH = "/"
